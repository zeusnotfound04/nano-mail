services:
  postgres:
    image: postgres:16-alpine
    container_name: nanomail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nanomail-net
    # no "ports:" published — reachable only from other containers on nanomail-net

  smtp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanomail-smtp
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SMTP_DOMAIN: ${SMTP_DOMAIN:-zeus.nanomail.in}
      SMTP_ALLOWED_DOMAINS: ${SMTP_ALLOWED_DOMAINS:-}
      RETENTION_PERIOD: ${RETENTION_PERIOD:-24h}
      RETENTION_INTERVAL: ${RETENTION_INTERVAL:-15m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "25:25"
    stop_grace_period: 30s
    networks:
      - nanomail-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: nanomail-ui
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - nanomail-net

networks:
  nanomail-net:
    driver: bridge

volumes:
  pgdata:
